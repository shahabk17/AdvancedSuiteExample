# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  - azure-pipelines

pool:   
  name: Azure Pipelines
  vmImage: windows-2022

steps:
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '8.x'

- task: NuGetCommand@2
  displayName: 'Restore NuGet packages'
  inputs:
   restoreSolution: 'IDM.Digitech.Automation.SCS.sln'
   feedsToUse: 'select'
   vstsFeed: 'CommonAPI' 

- script: dotnet restore IDM.Digitech.Automation.SCS.sln --configfile NuGet.config
  displayName: 'Dotnet restore with config'

- script: dotnet build IDM.Digitech.Automation.SCS.sln --configuration Release
  displayName: 'Build solution'

- task: CopyFiles@2
  displayName: 'Copy binaries and test data'
  inputs:
    contents: '**\bin\Release\net8.0\**'
    targetFolder: '$(Build.ArtifactStagingDirectory)'

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: '$(Build.ArtifactStagingDirectory)'
    artifactName: 'drop'

